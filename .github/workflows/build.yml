name: WinPulse build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Сначала сама программа: если упадут только тесты, exe всё равно будет.
      - name: Publish WinPulse.exe
        run: dotnet publish src/WinPulse.App/WinPulse.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o dist -nologo "-flp:LogFile=build-errors.txt;ErrorsOnly"

      # PresentMon (Intel, MIT) кладём рядом с WinPulse.exe — замер FPS работает без скачивания.
      - name: Bundle PresentMon
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ 'User-Agent' = 'winpulse-ci'; 'Authorization' = "Bearer $env:GH_TOKEN" }
          $releases = Invoke-RestMethod 'https://api.github.com/repos/GameTechDev/PresentMon/releases?per_page=20' -Headers $headers
          $asset = $releases | Where-Object { -not $_.draft } | ForEach-Object { $_.assets } |
            Where-Object { $_.name -match '^PresentMon-[\d.]+-x64\.exe$' } | Select-Object -First 1
          if ($asset) {
            Invoke-WebRequest $asset.browser_download_url -OutFile "dist/$($asset.name)"
            Write-Output "::notice title=PresentMon::bundled $($asset.name)"
          } else {
            Write-Output "::warning title=PresentMon::no x64 console asset found"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: WinPulse-win-x64
          path: dist/*.exe

      - name: Tests
        if: always()
        shell: pwsh
        run: |
          dotnet test tests/WinPulse.Core.Tests/WinPulse.Core.Tests.csproj -c Release -nologo --logger "console;verbosity=normal" *> test-output.txt
          $code = $LASTEXITCODE
          Get-Content test-output.txt
          # Упавшие тесты — аннотациями, чтобы их было видно без входа в GitHub
          $lines = Get-Content test-output.txt
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\s*Failed\s+(\S+)') {
              $msg = ($lines[$i..([Math]::Min($i + 8, $lines.Count - 1))] -join ' | ') -replace '\s+', ' '
              Write-Output "::error title=Test failed::$msg"
            }
          }
          exit $code

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-errors
          path: build-errors.txt
          if-no-files-found: ignore

      # Снимки всех страниц в демо-режиме — чтобы проверять дизайн без живого экрана.
      - name: Screenshots
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process -FilePath "dist/WinPulse.exe" -ArgumentList '--demo', '--lang', 'ru', '--screenshots', "$PWD/shots" -PassThru
          if (-not $p.WaitForExit(240000)) {
            "timeout" | Out-File shots/timeout.txt
            # Снимок всего экрана: виден ли модальный диалог или окно вообще
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD/shots/desktop.png")
            $p.Kill()
          }
          "exit code: $($p.ExitCode)" | Out-File -Append shots/progress.txt
          $log = Join-Path $env:LOCALAPPDATA "WinPulse/logs/winpulse.log"
          if (Test-Path $log) { Copy-Item $log shots/winpulse.log -Force }
          Get-ChildItem shots | Format-Table Name, Length

      # Те же страницы на английском — проверка, что ничего не осталось без перевода.
      - name: Screenshots (English)
        if: success()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots/en | Out-Null
          $p = Start-Process -FilePath "dist/WinPulse.exe" -ArgumentList '--demo', '--lang', 'en', '--screenshots', "$PWD/shots/en" -PassThru
          if (-not $p.WaitForExit(240000)) { "timeout" | Out-File shots/en/timeout.txt; $p.Kill() }

      # Пробный замер FPS самой программы: проверяет запуск PresentMon и формат его вывода.
      - name: PresentMon smoke test
        if: success()
        continue-on-error: true
        shell: pwsh
        run: |
          $pm = Get-ChildItem dist -Filter 'PresentMon-*.exe' | Select-Object -First 1
          if (-not $pm) { Write-Output "::warning title=PresentMon smoke::not bundled"; exit 0 }
          $app = Start-Process dist/WinPulse.exe -ArgumentList '--demo' -PassThru
          Start-Sleep 6
          & $pm.FullName --process_name WinPulse.exe --output_file "$PWD/pm.csv" --timed 6 --terminate_after_timed --no_console_stats --stop_existing_session 2>&1 | Out-File pm-console.txt
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path pm.csv) {
            $lines = Get-Content pm.csv
            Write-Output "::notice title=PresentMon CSV::$($lines.Count) lines"
            Write-Output "::notice title=PresentMon header::$($lines[0])"
            if ($lines.Count -gt 1) { Write-Output "::notice title=PresentMon row::$($lines[1])" }
          } else {
            $console = (Get-Content pm-console.txt -ErrorAction SilentlyContinue) -join ' | '
            Write-Output "::warning title=PresentMon smoke::no csv. $console"
          }

      # Замер задержек DPC/ISR на раннере (он работает с правами администратора) — проверка ETW-кода на настоящей Windows.
      - name: Latency smoke test
        if: success()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $file = Join-Path $PWD "shots/latency-0123456789abcdef0123456789abcdef.json"
          $p = Start-Process dist/WinPulse.exe -ArgumentList '--latency','5',"`"$file`"" -PassThru -Wait
          Write-Output "::notice title=Latency exit::$($p.ExitCode)"
          if (Test-Path $file) {
            $r = Get-Content $file -Raw | ConvertFrom-Json
            Write-Output "::notice title=Latency::DPC=$($r.DpcCount) ISR=$($r.IsrCount) maxDPC=$($r.MaxDpcUs) maxISR=$($r.MaxIsrUs) modules=$($r.ModulesKnown) source=$($r.ModuleSource) lost=$($r.EventsLost) sec=$($r.Seconds) error=$($r.Error)"
            $top = ($r.Drivers | Select-Object -First 8 | ForEach-Object { "$($_.Name) dpc=$($_.DpcCount) isr=$($_.IsrCount) max=$([math]::Round($_.MaxUs))" }) -join ' | '
            Write-Output "::notice title=Latency drivers::$top"
            Write-Output "::notice title=Latency histogram::$($r.Histogram -join ',')"
            Write-Output "::notice title=Latency debug::$($r.Debug)"
          } else {
            Write-Output "::warning title=Latency::no json"
          }

      - name: Publish screenshots to branch winpulse-shots
        if: success() && github.event_name == 'push'
        shell: pwsh
        run: |
          git config user.name "winpulse-ci"
          git config user.email "winpulse-ci@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "shots-repo"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item shots/* $tmp -Recurse
          Set-Location $tmp
          git init -q
          git checkout -q -b winpulse-shots
          "Commit: $env:GITHUB_SHA" | Out-File SOURCE.txt
          git add -A
          git -c user.name=winpulse-ci -c user.email=winpulse-ci@users.noreply.github.com commit -q -m "Снимки экрана для $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" winpulse-shots
