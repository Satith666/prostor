name: WinPulse build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Версия: из тега winpulse-vX.Y.Z для выпуска, иначе X.Y.Z-dev.<номер сборки> из Directory.Build.props.
      - name: Version
        shell: pwsh
        run: |
          $base = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF -like 'refs/tags/winpulse-v*') { $v = $env:GITHUB_REF -replace '^refs/tags/winpulse-v', '' }
          else { $v = "$base-dev.$env:GITHUB_RUN_NUMBER" }
          $num = ($v -split '-')[0]
          "WP_VERSION=$v" >> $env:GITHUB_ENV
          "WP_NUMERIC=$num" >> $env:GITHUB_ENV
          Write-Output "::notice title=Version::$v"

      # Сначала сама программа: если упадут только тесты, exe всё равно будет.
      - name: Publish WinPulse.exe
        run: dotnet publish src/WinPulse.App/WinPulse.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=${{ env.WP_VERSION }} -o dist -nologo "-flp:LogFile=build-errors.txt;ErrorsOnly"

      # PresentMon (Intel, MIT) кладём рядом с WinPulse.exe — замер FPS работает без скачивания.
      - name: Bundle PresentMon
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ 'User-Agent' = 'winpulse-ci'; 'Authorization' = "Bearer $env:GH_TOKEN" }
          $releases = Invoke-RestMethod 'https://api.github.com/repos/GameTechDev/PresentMon/releases?per_page=20' -Headers $headers
          $asset = $releases | Where-Object { -not $_.draft } | ForEach-Object { $_.assets } |
            Where-Object { $_.name -match '^PresentMon-[\d.]+-x64\.exe$' } | Select-Object -First 1
          if ($asset) {
            Invoke-WebRequest $asset.browser_download_url -OutFile "dist/$($asset.name)"
            Write-Output "::notice title=PresentMon::bundled $($asset.name)"
          } else {
            Write-Output "::warning title=PresentMon::no x64 console asset found"
          }

      # Установщик (Inno Setup, для текущего пользователя), переносная версия в zip и контрольные суммы.
      - name: Installer and portable zip
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source }
          if (-not (Test-Path dist/NvAPIWrapper.dll)) { Write-Output "::warning title=Bundle::NvAPIWrapper.dll is not next to WinPulse.exe" }
          & $iscc /Q "/DAppVersion=$env:WP_VERSION" "/DNumericVersion=$env:WP_NUMERIC" "/DSourceDir=$PWD\dist" installer\WinPulse.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $files = @('dist/WinPulse.exe', 'docs/THIRD_PARTY_NOTICES.txt') + (Get-ChildItem dist -Filter *.dll).FullName + (Get-ChildItem dist -Filter 'PresentMon-*.exe').FullName
          Compress-Archive -Path $files -DestinationPath "release/WinPulse-$env:WP_VERSION-portable.zip" -Force
          Get-ChildItem release -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File release/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | ForEach-Object { Write-Output "::notice title=Release file::$($_.Name) $([math]::Round($_.Length / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: WinPulse-win-x64
          path: |
            dist/*.exe
            dist/*.dll
            release/*

      - name: Tests
        if: always()
        shell: pwsh
        run: |
          dotnet test tests/WinPulse.Core.Tests/WinPulse.Core.Tests.csproj -c Release -nologo --logger "console;verbosity=normal" *> test-output.txt
          $code = $LASTEXITCODE
          Get-Content test-output.txt
          # Упавшие тесты — аннотациями, чтобы их было видно без входа в GitHub
          $lines = Get-Content test-output.txt
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^\s*Failed\s+(\S+)') {
              $msg = ($lines[$i..([Math]::Min($i + 8, $lines.Count - 1))] -join ' | ') -replace '\s+', ' '
              Write-Output "::error title=Test failed::$msg"
            }
          }
          exit $code

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-errors
          path: build-errors.txt
          if-no-files-found: ignore

      # Снимки всех страниц в демо-режиме — чтобы проверять дизайн без живого экрана.
      - name: Screenshots
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process -FilePath "dist/WinPulse.exe" -ArgumentList '--demo', '--lang', 'ru', '--screenshots', "$PWD/shots" -PassThru
          if (-not $p.WaitForExit(240000)) {
            "timeout" | Out-File shots/timeout.txt
            # Снимок всего экрана: виден ли модальный диалог или окно вообще
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD/shots/desktop.png")
            $p.Kill()
          }
          "exit code: $($p.ExitCode)" | Out-File -Append shots/progress.txt
          $log = Join-Path $env:LOCALAPPDATA "WinPulse/logs/winpulse.log"
          if (Test-Path $log) { Copy-Item $log shots/winpulse.log -Force }
          Get-ChildItem shots | Format-Table Name, Length

      # Те же страницы на английском — проверка, что ничего не осталось без перевода.
      - name: Screenshots (English)
        if: success()
        timeout-minutes: 6
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots/en | Out-Null
          $p = Start-Process -FilePath "dist/WinPulse.exe" -ArgumentList '--demo', '--lang', 'en', '--screenshots', "$PWD/shots/en" -PassThru
          if (-not $p.WaitForExit(240000)) { "timeout" | Out-File shots/en/timeout.txt; $p.Kill() }
          # Строки с кириллицей на английских страницах — то, что осталось без перевода.
          $ru = Get-ChildItem shots/en -Filter *.txt | Where-Object Name -ne 'progress.txt' | ForEach-Object {
            $page = $_.BaseName
            Get-Content $_.FullName -Encoding utf8 | Where-Object { $_ -match '[А-Яа-яЁё]' } | ForEach-Object { "$page`t$_" }
          }
          $ru | Out-File shots/en/untranslated.txt -Encoding utf8
          Write-Output "::notice title=Untranslated::$(@($ru).Count) lines"

      # Пробный замер FPS самой программы: проверяет запуск PresentMon и формат его вывода.
      - name: PresentMon smoke test
        if: success()
        timeout-minutes: 6
        continue-on-error: true
        shell: pwsh
        run: |
          $pm = Get-ChildItem dist -Filter 'PresentMon-*.exe' | Select-Object -First 1
          if (-not $pm) { Write-Output "::warning title=PresentMon smoke::not bundled"; exit 0 }
          $app = Start-Process dist/WinPulse.exe -ArgumentList '--demo' -PassThru
          Start-Sleep 6
          & $pm.FullName --process_name WinPulse.exe --output_file "$PWD/pm.csv" --timed 6 --terminate_after_timed --no_console_stats --stop_existing_session 2>&1 | Out-File pm-console.txt
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path pm.csv) {
            $lines = Get-Content pm.csv
            Write-Output "::notice title=PresentMon CSV::$($lines.Count) lines"
            Write-Output "::notice title=PresentMon header::$($lines[0])"
            if ($lines.Count -gt 1) { Write-Output "::notice title=PresentMon row::$($lines[1])" }
          } else {
            $console = (Get-Content pm-console.txt -ErrorAction SilentlyContinue) -join ' | '
            Write-Output "::warning title=PresentMon smoke::no csv. $console"
          }

      # Установщик: тихая установка для пользователя, повторный запуск WinPulse после неё (как при автообновлении), удаление.
      - name: Installer smoke test
        if: success()
        timeout-minutes: 6
        continue-on-error: true
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'WinPulse-Setup-*.exe' | Select-Object -First 1
          # Не -Wait: он ждёт и потомков, а установщик после тихой установки снова запускает WinPulse.
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=ru' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill() }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\WinPulse'
          $files = (Get-ChildItem $dir -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', '
          Start-Sleep 5
          $running = @(Get-Process WinPulse -ErrorAction SilentlyContinue).Count
          Write-Output "::notice title=Installer::exit $($p.ExitCode); files: $files; relaunched: $running"
          Get-Process WinPulse -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -PassThru
          $u.WaitForExit(120000) | Out-Null
          Start-Sleep 5
          Write-Output "::notice title=Uninstaller::exit $($u.ExitCode); exe left: $(Test-Path (Join-Path $dir 'WinPulse.exe'))"

      # Цепочка автообновления: найти выпуск на GitHub, скачать установщик, сверить SHA-256 (без установки).
      - name: Update self-test
        if: success()
        timeout-minutes: 6
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process dist/WinPulse.exe -ArgumentList '--update-selftest', "$PWD\update-selftest.txt" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill() }
          Write-Output "::notice title=Update self-test::exit $($p.ExitCode): $((Get-Content update-selftest.txt -ErrorAction SilentlyContinue) -join ' | ')"

      # Замер задержек DPC/ISR на раннере (он работает с правами администратора) — проверка ETW-кода на настоящей Windows.
      - name: Latency smoke test
        if: success()
        timeout-minutes: 6
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $file = Join-Path $PWD "shots/latency-0123456789abcdef0123456789abcdef.json"
          $p = Start-Process dist/WinPulse.exe -ArgumentList '--latency','5',"`"$file`"" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          Write-Output "::notice title=Latency exit::$($p.ExitCode)"
          if (Test-Path $file) {
            $r = Get-Content $file -Raw | ConvertFrom-Json
            Write-Output "::notice title=Latency::DPC=$($r.DpcCount) ISR=$($r.IsrCount) maxDPC=$($r.MaxDpcUs) maxISR=$($r.MaxIsrUs) modules=$($r.ModulesKnown) source=$($r.ModuleSource) lost=$($r.EventsLost) sec=$($r.Seconds) error=$($r.Error)"
            $top = ($r.Drivers | Select-Object -First 8 | ForEach-Object { "$($_.Name) dpc=$($_.DpcCount) isr=$($_.IsrCount) max=$([math]::Round($_.MaxUs))" }) -join ' | '
            Write-Output "::notice title=Latency drivers::$top"
            Write-Output "::notice title=Latency histogram::$($r.Histogram -join ',')"
            Write-Output "::notice title=Latency debug::$($r.Debug)"
          } else {
            Write-Output "::warning title=Latency::no json"
          }

      - name: Publish screenshots to branch winpulse-shots
        if: success() && github.ref == 'refs/heads/winpulse'
        shell: pwsh
        run: |
          git config user.name "winpulse-ci"
          git config user.email "winpulse-ci@users.noreply.github.com"
          $tmp = Join-Path $env:RUNNER_TEMP "shots-repo"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Copy-Item shots/* $tmp -Recurse
          Set-Location $tmp
          git init -q
          git checkout -q -b winpulse-shots
          "Commit: $env:GITHUB_SHA" | Out-File SOURCE.txt
          git add -A
          git -c user.name=winpulse-ci -c user.email=winpulse-ci@users.noreply.github.com commit -q -m "Снимки экрана для $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" winpulse-shots

      # Выпуск на GitHub: только по тегу winpulse-v*. Не помечаем «Latest», чтобы не трогать страницу Prostor.
      - name: GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/winpulse-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = "docs/releases/$env:WP_VERSION.md"
          if (-not (Test-Path $notes)) { $notes = 'docs/releases/default.md' }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem release -File).FullName --repo $env:GITHUB_REPOSITORY --title "WinPulse $env:WP_VERSION" --notes-file $notes --latest=false
